name: Windows C++ Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet dependencies
        run: |
          nuget restore JK_BMS_PC.sln -PackagesDirectory packages
          msbuild JK_BMS_PC.vcxproj -t:Restore -p:Configuration=Release -p:Platform=x64
      - name: Build Windows x64 Release
        run: msbuild JK_BMS_PC.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: JK-BMS-PC-Windows-x64
          path: |
            x64/Release/*.exe
            x64/Release/web/index.html
            x64/Release/WebView2Loader.dll
          if-no-files-found: error
