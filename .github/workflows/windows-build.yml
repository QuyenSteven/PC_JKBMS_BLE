name: Windows C++ Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restore native WebView2 SDK
        run: |
          nuget restore JK_BMS_PC.sln -PackagesDirectory packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "Native WebView2 SDK restore failed" }
          $sdk="packages/Microsoft.Web.WebView2.1.0.2903.40/build/native"
          if (-not (Test-Path "$sdk/include/WebView2.h")) { throw "WebView2.h missing after restore" }
          if (-not (Test-Path "$sdk/x64/WebView2LoaderStatic.lib")) { throw "WebView2LoaderStatic.lib missing after restore" }
      - name: Build Windows x64 Release
        run: |
          msbuild JK_BMS_PC.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "C++ build failed" }
      - name: Compile and run JK protocol regression tests
        run: |
          msbuild tests/jk_protocol_tests.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Protocol test compilation failed" }
          & "tests/x64/Release/jk_protocol_tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "JK protocol tests failed" }
      - name: Test WebUI JavaScript and live telemetry DOM
        shell: pwsh
        run: |
          node tests/webui_smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw "WebUI smoke tests failed" }
          node --check web/settings.js
          if ($LASTEXITCODE -ne 0) { throw "Settings JavaScript syntax check failed" }
          node tests/settings_ui_smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw "Settings editor and guarded write tests failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: JK-BMS-PC-Windows-x64
          path: |
            x64/Release/*.exe
            x64/Release/web/index.html
            x64/Release/web/settings.js
          if-no-files-found: error
